[project]
name = "transcript-deid"
version = "0.1.0"
description = "Offline de-identification of interview transcripts: roster-based study IDs, PHI redaction, garbled-text flagging, local review UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "presidio-analyzer>=2.2.355",
    "spacy>=3.7,<3.9",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "python-docx>=1.1",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
transcript-deid = "transcript_deid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_deid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
